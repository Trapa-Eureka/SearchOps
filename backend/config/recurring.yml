# Recurring tasks run by the Solid Queue scheduler (bin/jobs, or Puma with the solid_queue plugin).
# Format: https://github.com/rails/solid_queue#recurring-tasks
default: &default
  schedule_keyword_checks:
    class: ScheduleSearchesJob
    schedule: every 10 minutes
  reap_stuck_runs:
    class: ReapStuckRunsJob
    schedule: every 5 minutes

development:
  <<: *default

production:
  <<: *default
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
